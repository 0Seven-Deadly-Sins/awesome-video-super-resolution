name: Candidate evidence preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify safeguards
        run: python -m unittest discover -s tests -v
      - name: Collect evidence only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/weekly.py --dry-run --bootstrap
      - name: Preserve source collection preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-preview-${{ github.run_id }}
          path: work/preview*
          if-no-files-found: ignore
          retention-days: 14
