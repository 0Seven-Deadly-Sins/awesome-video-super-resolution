    <text x="62" y="162" fill="#f2f8fc" font-size="43" font-weight="750" letter-spacing="-1.1">Video Super-Resolution</text>
    <text x="65" y="202" fill="#b8d1df" font-size="18">A curated map of methods, models, datasets and benchmarks.</text>
    <text x="65" y="231" fill="#84adbf" font-size="16">视频超分辨率研究地图 · 从经典重建到生成式方法</text>
