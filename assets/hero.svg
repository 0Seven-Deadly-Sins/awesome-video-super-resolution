<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Video Super-Resolution</title>
  <desc id="desc">An open research map of video super-resolution methods, architectures, datasets and benchmarks.</desc>
  <defs>
