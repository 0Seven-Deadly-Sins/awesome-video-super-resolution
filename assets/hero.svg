    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#204565"/><stop offset="1" stop-color="#15334e"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#9ac8e5" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#background)"/>
